name: Interframe Continuity QA CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-engine-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless jsonschema

      - name: Run Unit and Integration Test Suite
        run: |
          python3 -m unittest discover -s tests -t . -p "test_*.py" -v

      - name: Run Reproducible LEAVE_ALIVE Benchmark Evaluation (B1, B2, B3)
        run: |
          python3 evaluation/evaluate_baselines.py
