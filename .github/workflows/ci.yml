name: Interframe Continuity QA CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-engine-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . || pip install numpy opencv-python-headless jsonschema

      - name: Run Unit and Integration Test Suite
        run: |
          python3 -m unittest discover -s tests -t . -p "test_*.py" -v

      - name: Run Reproducible LEAVE_ALIVE Benchmark Evaluation (B1, B2, B3)
        run: |
          python3 evaluation/evaluate_baselines.py
